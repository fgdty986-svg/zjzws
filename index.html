<style>

  .speedcard{grid-column:1/-1; background:linear-gradient(135deg,var(--card2),var(--card))}
  .gauges{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:6px 0 18px}
  .gauge{text-align:center; padding:14px 8px; background:#0e1428; border-radius:12px; border:1px solid var(--line)}
  .gauge .lbl{font-size:12px; color:var(--sub); margin-bottom:8px}
  .gauge .num{font-size:24px; font-weight:700}
  .gauge .num small{font-size:11px; color:var(--sub); font-weight:500}

    padding:12px 22px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;

const $ = id => document.getElementById(id);

/* ============ 多语言翻译表 ============ */

let lang = localStorage.getItem('netcheck_lang');
if(!lang){
  const n = (navigator.language||'zh').toLowerCase();
  if(n.startsWith('ja')) lang='ja';
  else if(n.startsWith('zh')) lang='zh';
  else lang='en';
}
function t(k){
  const v = (I18N[lang] && I18N[lang][k]!=null) ? I18N[lang][k] : I18N.zh[k];
  return v==null ? k : v;
}
function setLang(l){
  lang = l;
  localStorage.setItem('netcheck_lang', l);
  document.documentElement.lang = (l==='zh') ? 'zh-CN' : l;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  // 重新渲染带"当前语言文本"的动态部分
  if($('srcTag').dataset.state) $('srcTag').textContent = t($('srcTag').dataset.state);
  fillDevice();
  renderHistory();
}

/* ============ 后端检测：决定用本地端点还是 Cloudflare 公共端点 ============ */
const EP = {
  local:false,
  downURL:b => `https://speed.cloudflare.com/__down?bytes=${b}`,
  upURL:  () => `https://speed.cloudflare.com/__up`,
  pingURL:() => `https://speed.cloudflare.com/__down?bytes=0`,
};
async function detectBackend(){
  try{
    const r = await fetch('/api/ping', {cache:'no-store'});
    const txt = (await r.text()).trim();
    // 仅当真后端精确返回 "pong" 才启用本地端点；
    // Cloudflare Pages 等静态托管会对未知路径返回 200 + 首页 HTML，需排除
    if(r.ok && txt === 'pong'){
      EP.local = true;
      EP.downURL = b => `/api/download?bytes=${b}`;
      EP.upURL   = () => `/api/upload`;
      EP.pingURL = () => `/api/ping`;
    }
  }catch(e){}
  $('srcTag').dataset.state = EP.local ? 'srcLocal' : 'srcCloud';
  $('srcTag').textContent = t($('srcTag').dataset.state);
}

/* ============ 设备 / 本地信息 ============ */
function fillDevice(){
  $('screen').textContent = `${screen.width}×${screen.height} @${window.devicePixelRatio}x`;
  $('lang').textContent   = navigator.language || '—';
  const ua = navigator.userAgent;
  let os = t('unknown');
  if(/Windows NT 10/.test(ua)) os='Windows 10/11';
  else if(/Windows/.test(ua)) os='Windows';
  else if(/Mac OS X/.test(ua)) os='macOS';
  else if(/Android/.test(ua)) os='Android';
  else if(/iPhone|iPad/.test(ua)) os='iOS';
  else if(/Linux/.test(ua)) os='Linux';
  $('os').textContent = os;
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  $('conn').textContent = c ? `${c.effectiveType||'?'}${c.downlink?` · ~${c.downlink}Mbps`:''}` : t('notSupported');
}

/* ============ WebRTC 探测局域网 IP ============ */
function findLocalIP(){
  try{
    const pc = new RTCPeerConnection({iceServers:[]});
    pc.createDataChannel('');
    pc.createOffer().then(o=>pc.setLocalDescription(o));
    const seen = new Set();
    pc.onicecandidate = e=>{
      if(!e.candidate) return;
      const m = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
      if(m && !m[1].startsWith('0') && !seen.has(m[1])){
        seen.add(m[1]); $('lanip').textContent = [...seen].join(', ');
      }
    };
    setTimeout(()=>{ if(!seen.size) $('lanip').textContent=t('lanBlocked'); },2000);
  }catch(e){ $('lanip').textContent=t('notSupported'); }
}

/* ============ 公网 IP + 归属地 + 地图 ============ */
let map;
function showMap(lat, lng, label){
  if(!lat || !lng || typeof L==='undefined') return;
  if(!map){
    map = L.map('map',{zoomControl:true, attributionControl:false}).setView([lat,lng], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
  } else { map.setView([lat,lng], 9); }
  L.marker([lat,lng]).addTo(map).bindPopup(label||t('mapPopupDefault')).openPopup();
}
async function fetchIP(){
  try{
    const r = await fetch('https://ipapi.co/json/');
    if(!r.ok) throw 0;
    const d = await r.json();
    $('ip').textContent  = d.ip || '—';
    $('loc').textContent = [d.city,d.region,d.country_name].filter(Boolean).join(', ') || '—';
    $('isp').textContent = d.org || '—';
    $('geo').textContent = (d.latitude&&d.longitude) ? `${d.latitude}, ${d.longitude}` : '—';
    $('tz').textContent  = d.timezone || '—';
    showMap(d.latitude, d.longitude, `${d.ip}<br>${[d.city,d.country_name].filter(Boolean).join(', ')}`);
  }catch(e){
    try{
      const r2 = await fetch('https://api.ipify.org?format=json');
      const d2 = await r2.json();
      $('ip').textContent = d2.ip;
      $('loc').textContent = t('locFail');
    }catch(_){ $('ip').textContent=t('ipFail'); }
  }
}

/* ============ 测速核心 ============ */
async function measurePing(times=6){
  const samples=[];
  for(let i=0;i<times;i++){
    const tm=performance.now();
    try{ await fetch(EP.pingURL()+(EP.pingURL().includes('?')?'&':'?')+'t='+Math.random(),{cache:'no-store'}); }catch(e){}
    samples.push(performance.now()-tm);
    $('prog').style.width = (i+1)/times*15+'%';
  }
  samples.sort((a,b)=>a-b);
  let jitter=0;
  for(let i=1;i<samples.length;i++) jitter+=Math.abs(samples[i]-samples[i-1]);
  jitter/=(samples.length-1);
  return {ping:Math.round(samples[0]), jitter:Math.round(jitter)};
}

async function measureDownload(){
  const sizes=[2e6, 10e6, 25e6];   // 第一次热身
  let best=0;
  for(let i=0;i<sizes.length;i++){
    const tm=performance.now();
    try{
      const r=await fetch(EP.downURL(sizes[i])+'&t='+Math.random(),{cache:'no-store'});
      const reader=r.body.getReader(); let recv=0;
      while(true){ const {done,value}=await reader.read(); if(done) break; recv+=value.length; }
      const mbps=(recv*8)/((performance.now()-tm)/1000)/1e6;
      if(i>0) best=Math.max(best,mbps);
      $('dl').textContent=mbps.toFixed(1);
    }catch(e){}
    $('prog').style.width = 15 + (i+1)/sizes.length*45 + '%';
    $('status').textContent = `${t('statusDl')} (${sizes[i]/1e6}MB)`;
  }
  return best;
}

function makePayload(size){
  const buf = new Uint8Array(size);
  const seed = new Uint8Array(65536);
  crypto.getRandomValues(seed);
  for(let i=0;i<size;i+=65536) buf.set(seed.subarray(0,Math.min(65536,size-i)), i);
  return buf;
}
async function measureUpload(){
  const sizes=[1e6, 5e6, 8e6];   // 第一次热身
  let best=0;
  for(let i=0;i<sizes.length;i++){
    const data=makePayload(sizes[i]);
    const tm=performance.now();
    try{
      await fetch(EP.upURL(),{method:'POST',body:data,cache:'no-store',headers:{'Content-Type':'application/octet-stream'}});
      const mbps=(sizes[i]*8)/((performance.now()-tm)/1000)/1e6;
      if(i>0) best=Math.max(best,mbps);
      $('ul').textContent=mbps.toFixed(1);
    }catch(e){}
    $('prog').style.width = 60 + (i+1)/sizes.length*40 + '%';
    $('status').textContent = `${t('statusUl')} (${sizes[i]/1e6}MB)`;
  }
  return best;
}

async function runTest(){
  const btn=$('startBtn'); btn.disabled=true;
  $('prog').style.width='0%';
  $('dl').textContent=$('ul').textContent='--';
  $('status').textContent=t('statusPing');
  const {ping,jitter}=await measurePing();
  $('ping').textContent=ping; $('jitter').textContent=jitter;
  const dl=await measureDownload();
  const ul=await measureUpload();
  $('dl').textContent=dl.toFixed(1); $('ul').textContent=ul.toFixed(1);
  $('prog').style.width='100%';
  $('status').textContent=`${t('statusDone')}  ↓${dl.toFixed(1)} ↑${ul.toFixed(1)} Mbps · ${ping}ms · ${t('jitterShort')} ${jitter}ms`;
  saveHistory({dl, ul, ping, jitter});
  btn.disabled=false;
}

/* ============ 历史记录（localStorage） ============ */
const HKEY='netcheck_history';
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HKEY))||[]; }catch(e){ return []; } }
function saveHistory(rec){
  const list=loadHistory();
  list.unshift({t:Date.now(), ...rec});
  while(list.length>20) list.pop();
  localStorage.setItem(HKEY, JSON.stringify(list));
  renderHistory();
}
function renderHistory(){
  const box=$('histBox'); if(!box) return;
  const list=loadHistory();
  if(!list.length){ box.innerHTML=`<div class="empty">${t('histEmpty')}</div>`; return; }
  const avg=k => (list.reduce((s,r)=>s+(r[k]||0),0)/list.length);
  const avgLabel = (I18N[lang] && I18N[lang].avg) ? I18N[lang].avg : I18N.zh.avg;
  let rows = list.map(r=>{
    const d=new Date(r.t);
    const hm=`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<tr><td>${hm}</td><td>${r.dl.toFixed(1)}</td><td>${r.ul.toFixed(1)}</td><td>${r.ping}</td><td>${r.jitter}</td></tr>`;
  }).join('');
  box.innerHTML = `<table>
    <thead><tr><th>${t('thTime')}</th><th>${t('thDl')}</th><th>${t('thUl')}</th><th>${t('thPing')}</th><th>${t('thJitter')}</th></tr></thead>
    <tbody>${rows}
      <tr class="avgrow"><td>${avgLabel(list.length)}</td><td>${avg('dl').toFixed(1)}</td><td>${avg('ul').toFixed(1)}</td><td>${Math.round(avg('ping'))}</td><td>${Math.round(avg('jitter'))}</td></tr>
    </tbody></table>`;
}

/* ============ 启动 ============ */
setLang(lang);                       // 应用语言到所有静态文字
$('ip').textContent    = t('loading');
$('lanip').textContent = t('probing');
$('srcTag').textContent = t('detecting');
fillDevice();
findLocalIP();
fetchIP();
detectBackend();
renderHistory();
$('startBtn').addEventListener('click', runTest);
$('clearBtn').addEventListener('click', ()=>{ localStorage.removeItem(HKEY); renderHistory(); });
document.querySelectorAll('.langsw button').forEach(b=>{
  b.addEventListener('click', ()=>setLang(b.dataset.lang));
});
